name: Deploy Automatizado Contabo

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Conectar e Atualizar via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_PRIVATE_KEY }}
          port: 22
          script: |
            # 1. Entrar na pasta do projeto
            cd /root/whatsapp-saas

            # 2. Atualizar o código (git pull)
            # Como a chave pública está configurada no Repo, ele tem permissão de leitura
            git fetch origin
            git checkout main
            git pull origin main

            # 3. Garantir que a rede externa existe (evita erro no docker-compose)
            docker network create rede-global || true

            # 4. Parar o container atual para garantir limpeza
            docker compose -f docker.compose.yml down || true

            # 5. Recriar os containers com a nova versão (FORÇANDO rebuild completo)
            # --no-cache: ignora cache de build (garante código novo)
            # --force-recreate: recria o container mesmo se não detectar mudança
            docker compose -f docker.compose.yml build --no-cache
            docker compose -f docker.compose.yml up -d --force-recreate --remove-orphans

            # 6. Limpar imagens antigas para não lotar o disco da Contabo
            docker image prune -f

            # 7. Verificar se o container subiu corretamente
            echo "🔍 Verificando status do container..."
            sleep 5
            docker compose -f docker.compose.yml ps